name: Build staging container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - handler.py
      - src/**
      - config/**
      - workflows/**
      - custom_nodes/**
      - scripts/**
      - requirements/runtime.lock
      - .dockerignore
      - .github/workflows/container.yml
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES.txt

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Free hosted-runner space for CUDA layers
        shell: bash
        run: |
          # This is an isolated hosted runner, not a user's workstation.
          # Keep Docker and Python; the image build does not need these SDKs.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          docker image prune --all --force
          df -h /
          available=$(df --output=avail -B1 / | tail -1 | tr -d ' ')
          if (( available < 40 * 1024 * 1024 * 1024 )); then
            echo '::error::At least 40 GiB of free disk is required for this CUDA image build.'
            exit 1
          fi

      - name: Select immutable staging tag
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moss-comfyui"
          tag="staging-${GITHUB_SHA}"
          printf 'name=%s\nreference=%s:%s\n' "$image" "$image" "$tag" >> "$GITHUB_OUTPUT"

      - name: Build once into the Docker image store
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        shell: bash
        run: |
          # The native Docker builder avoids loading a second copy of this
          # large image from a separate Buildx container cache.
          docker build --progress=plain --pull \
            --build-arg "VERSION=staging-${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE_REFERENCE" .

      - name: Check baked dependencies on CPU
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: >-
          docker run --rm --network none --no-healthcheck
          --entrypoint /opt/venv/bin/python "$IMAGE_REFERENCE"
          -m moss_runtime.bootstrap --check-package

      - name: Smoke-check native templates and API schemas on CPU
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: >-
          docker run --rm --network none --no-healthcheck
          --entrypoint /opt/venv/bin/python "$IMAGE_REFERENCE"
          /opt/moss/scripts/smoke_container.py --timeout 120

      - name: Sign in to GHCR for this repository
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push the CPU-checked staging image
        id: publish
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        shell: bash
        run: |
          docker push "$IMAGE_REFERENCE"
          digest=$(docker image inspect "$IMAGE_REFERENCE" --format '{{index .RepoDigests 0}}')
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          {
            printf '### Staging image\n\n'
            printf '`%s`\n\n' "$IMAGE_REFERENCE"
            printf '`%s`\n\n' "$digest"
            printf 'CPU package and native-template smoke checks passed. GPU inference and Runpod release validation are separate gates.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner registry credentials
        if: always()
        run: docker logout ghcr.io
